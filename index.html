<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Aula Lab | Recursos Académicos</title>
<style>
:root {
  --bg: #0b1120;
  --panel: #151e30;
  --border: #29364b;
  --text: #f1f5f9;
  --muted: #a3b1c6;
  --accent: #38bdf8;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}
button, input { font: inherit; }
header {
  border-bottom: 1px solid var(--border);
  background: #101827;
  padding: 18px 6%;
}
.nav {
  max-width: 1150px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 850;
  letter-spacing: 1px;
}
.logo {
  background: var(--accent);
  color: #082032;
  padding: 10px;
  border-radius: 12px;
}
.nav small { color: var(--muted); }
main {
  width: 90%;
  max-width: 1150px;
  margin: 35px auto 70px;
}
.hero {
  padding: clamp(25px, 5vw, 55px);
  border: 1px solid var(--border);
  border-radius: 25px;
  background:
    radial-gradient(ellipse at 90% 0%, #164e6355, transparent 45%),
    linear-gradient(135deg, #172338, #111827);
}
.eyebrow {
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}
h1 {
  font-size: clamp(35px, 6vw, 62px);
  line-height: 1.05;
  margin: 15px 0;
  letter-spacing: -2px;
}
.hero p {
  max-width: 570px;
  color: var(--muted);
  line-height: 1.7;
}
.search {
  display: flex;
  gap: 10px;
  margin-top: 25px;
  max-width: 650px;
}
.search input {
  width: 100%;
  min-width: 0;
  padding: 15px;
  color: white;
  background: #0b1120;
  border: 1px solid #40506a;
  border-radius: 12px;
  outline-color: var(--accent);
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 35px 0 17px;
}
h2 { font-size: 22px; margin: 0; }
.counter { color: var(--muted); font-size: 13px; }
.categories {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.category {
  background: var(--panel);
  color: #dbeafe;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px;
  cursor: pointer;
  display: none;
}
.category:hover, .category.active {
  background: #075985;
  border-color: #38bdf8;
  color: white;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}
.card {
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  transition: transform .2s, border-color .2s;
}
.card:hover {
  transform: translateY(-3px);
  border-color: #38bdf8;
}
.cover {
  min-height: 130px;
  display: grid;
  place-items: center;
  font-size: 52px;
}
.blue { background: linear-gradient(135deg,#164e63,#0e7490); }
.purple { background: linear-gradient(135deg,#3b276d,#6d28d9); }
.orange { background: linear-gradient(135deg,#78350f,#c2410c); }
.green { background: linear-gradient(135deg,#14532d,#15803d); }
.pink { background: linear-gradient(135deg,#831843,#be185d); }
.card-body { padding: 18px; }
.tag {
  color: #7dd3fc;
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.card h3 { font-size: 18px; margin: 9px 0; }
.card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  min-height: 42px;
}
.play {
